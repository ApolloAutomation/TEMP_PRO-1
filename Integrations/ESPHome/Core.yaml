substitutions:
  version: "26.11.15.2"
  device_description: $TEMP_PRO-1 made by Apollo Automation - version ${version}.

  # Manifest URL bases. Stable = GitHub Pages (main branch builds).
  # Beta = rolling "beta-fw" pre-release assets (beta branch builds).
  stable_manifest_base: "https://apolloautomation.github.io/TEMP_PRO-1"
  beta_manifest_base: "https://github.com/ApolloAutomation/TEMP_PRO-1/releases/download/beta-fw"
  # Legacy _W/_ETH shims override these so fielded devices keep their manifest URLs
  stable_manifest_dir: "firmware"
  # Must match the manifest-<key>.json names build-beta.yml uploads
  beta_manifest_key: "standard"
  ota_stable_manifest: "${stable_manifest_base}/${stable_manifest_dir}/manifest.json"
  ota_beta_manifest: "${beta_manifest_base}/manifest-${beta_manifest_key}.json"

  # Bluetooth Proxy switch state on a device with no stored preference yet.
  # TEMP_PRO-1 never proxied before this switch was added, so it ships off.
  bluetooth_proxy_restore_mode: RESTORE_DEFAULT_OFF
  # "false" keeps WiFi off entirely (Ethernet-only, like the old Ethernet firmware)
  wifi_fallback: "true"
  # The legacy _ETH shim sets "true" so an upgraded Ethernet unit's first boot is WiFi-silent
  ethernet_expected_default: "false"

esphome:
  friendly_name: Apollo TEMP_PRO-1
  comment: Apollo TEMP_PRO-1
  name_add_mac_suffix: true
  platformio_options:
    board_build.flash_mode: dio
  # improv_ble (renamed from esp32_improv) needs 2026.10
  min_version: 2026.10.0
  # dns_getserver() for the DNS restore interval
  includes:
    - <lwip/dns.h>
  # List form so package merging concatenates with Battery.yaml's on_boot
  # entries (mapping form would be replaced instead).
  on_boot:
    # Keep WiFi off when Ethernet is expected, so the fallback hotspot can't
    # broadcast while Ethernet waits for DHCP. Runs after globals restore (800), before wifi setup.
    - priority: 600
      then:
        - if:
            condition:
              lambda: "return id(ethernet_expected) || !id(wifi_fallback_on);"
            then:
              - lambda: "id(wifi_1).set_enable_on_boot(false);"
    - priority: 500
      then:
        - text_sensor.template.publish:
            id: apollo_firmware_version
            state: "${version}"
    - priority: -100
      then:
        - script.execute: apply_ota_source
    # Re-apply the Bluetooth Proxy switch after all components set up, so BLE
    # scanning matches the switch state restored from flash.
    - priority: -300
      then:
        - if:
            condition:
              switch.is_on: bluetooth_proxy_switch
            then:
              - esp32_ble_tracker.start_scan:
                  continuous: true
            else:
              - esp32_ble_tracker.stop_scan:
    # Ethernet never came up, so bring WiFi back for rejoin or provisioning
    - priority: -100
      then:
        - if:
            condition:
              lambda: "return id(ethernet_expected) && id(wifi_fallback_on);"
            then:
              - wait_until:
                  condition:
                    ethernet.connected:
                  timeout: 20s
              # A never-provisioned unit would open the hotspot here, so give a link
              # behind spanning tree (~30s to forward) more time first
              - if:
                  condition:
                    and:
                      - not:
                          ethernet.connected:
                      - lambda: "return !id(wifi_provisioned);"
                  then:
                    - wait_until:
                        condition:
                          ethernet.connected:
                        timeout: 40s
              - if:
                  condition:
                    not:
                      ethernet.connected:
                  then:
                    - lambda: "id(ethernet_expected) = false;"
                    - script.execute: wifi_reenable_radio

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_managed

http_request:
  verify_ssl: true
  # GitHub release-asset downloads answer with a redirect carrying a
  # ~3.6 KB Content-Security-Policy header; each header line must fit
  # this buffer or the request fails with "HTTP_CLIENT: Out of buffer".
  buffer_size_rx: 5120
  # The redirect target is a signed URL with a ~850-char query string; the
  # follow-up request line must fit the TX buffer or esp_http_client_open
  # fails with "Out of buffer" before sending anything.
  buffer_size_tx: 2048

safe_mode:

logger:

update:
  - platform: http_request
    id: update_http_request
    name: Firmware Update
    source: ${ota_stable_manifest}

# Prefer Ethernet whenever it is connected; ESPHome arbitrates the route
network:
  priority:
    - ethernet
    - wifi

ethernet:
  id: ethernet_1
  type: W5500
  clk_pin: GPIO10
  mosi_pin: GPIO12
  miso_pin: GPIO11
  cs_pin: GPIO9
  interrupt_pin: GPIO13
  reset_pin: GPIO14
  on_connect:
    # A wired device never deep sleeps (Battery.yaml); re-armed after a real cable pull
    - script.stop: ethernet_sleep_release
    - lambda: "id(deep_sleep_1).prevent_deep_sleep();"
    # Keep WiFi up alongside Ethernet so Home Assistant's connection to the
    # WiFi address survives; release it only when WiFi has no network to offer
    - if:
        condition:
          wifi.enabled:
        then:
          - if:
              condition:
                wifi.ap_active:
              then:
                # Fallback hotspot is broadcasting: WiFi has no network
                - script.execute: wifi_release_radio
              else:
                # WiFi may still be associating at boot, so wait it out.
                # Ends early if the fallback AP starts.
                - wait_until:
                    condition:
                      or:
                        - wifi.connected:
                        - wifi.ap_active:
                    timeout: 30s
                - if:
                    condition:
                      wifi.connected:
                    then:
                      - lambda: "id(ethernet_expected) = false;"
                    else:
                      # Leave WiFi alone if the cable vanished during the wait
                      - if:
                          condition:
                            ethernet.connected:
                          then:
                            - script.execute: wifi_release_radio
        else:
          # WiFi-silent boot (ethernet_expected): stays off
          - lambda: "id(ethernet_expected) = true;"
    - script.execute: check_for_updates
    - component.update: network_connection
  on_disconnect:
    - script.execute: ethernet_sleep_release
    # Cable gone, so bring WiFi up to rejoin or open the provisioning hotspot
    - lambda: "id(ethernet_expected) = false;"
    - if:
        condition:
          and:
            - lambda: "return id(ap_latched);"
            - not:
                wifi.connected:
        then:
          # ESPHome can't relaunch a once-started hotspot in the same boot, so reboot
          # into a fresh one, but only for a real cable pull (not a link blip) and
          # after a running self-test has finished
          - wait_until:
              condition:
                not:
                  script.is_running: testScript
              timeout: 30s
          - wait_until:
              condition:
                ethernet.connected:
              timeout: 15s
          - if:
              condition:
                and:
                  - not:
                      ethernet.connected:
                  - not:
                      wifi.connected:
              then:
                - lambda: |-
                    ESP_LOGW("network", "Cable removed after the hotspot was released; rebooting to restore provisioning");
                - delay: 500ms
                - lambda: "App.safe_reboot();"
        else:
          - if:
              condition:
                lambda: "return id(wifi_fallback_on);"
              then:
                - script.execute: wifi_reenable_radio
    - component.update: network_connection

wifi:
  id: wifi_1
  on_connect:
    # Must stay set: gates the recovery probe so it never pops the hotspot on
    # a device that was never provisioned
    - lambda: "id(wifi_provisioned) = true;"
    - script.execute: check_for_updates
    - component.update: network_connection
  on_disconnect:
    # Turn WiFi off after 60s without reassociation, which keeps the 90s
    # fallback hotspot from ever starting while Ethernet carries the device
    - if:
        condition:
          ethernet.connected:
        then:
          - wait_until:
              condition:
                wifi.connected:
              timeout: 60s
          - if:
              condition:
                and:
                  - wifi.enabled:
                  - not:
                      wifi.connected:
                  - ethernet.connected:
              then:
                - script.execute: wifi_release_radio
    - component.update: network_connection
  # Keeps today's no-reboot on lost Wi-Fi; 2026.11 drops the AP exemption
  reboot_timeout: 0s
  ap:
    ssid: "Apollo TEMP_PRO-1 Hotspot"

captive_portal:
  id: captive_portal_1

improv_serial:

improv_ble:
  id: esp32_improv_1
  authorizer: none

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    continuous: true

bluetooth_proxy:

api:
  id: api_server
  encryption:
  services:
    - service: play_buzzer
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
  reboot_timeout: 0s
  on_client_connected:
    then:
      - delay: 5s
      - if:
          condition:
            or:
              - binary_sensor.is_on: ota_mode
              - switch.is_on: prevent_sleep
              # A wired device never deep sleeps
              - ethernet.connected:
          then:
            - lambda: |-
                ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA, Switch Or Ethernet");
                id(deep_sleep_1).prevent_deep_sleep();
          else:
            - switch.turn_on: accessory_power
            - delay: 10s
            - lambda: |-
                id(reportAllValues).execute();
            - delay: 5s
            # deep_sleep.enter ignores prevent_deep_sleep(), so re-check here:
            # Ethernet may have come up during the report window
            - if:
                condition:
                  and:
                    - not:
                        ethernet.connected:
                    - switch.is_off: prevent_sleep
                    - binary_sensor.is_off: ota_mode
                then:
                  - deep_sleep.enter:
                      id: deep_sleep_1
globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    restore_value: no
    type: bool
    initial_value: "false"
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: "0"
  - id: sht30Passed
    restore_value: no
    type: bool
    initial_value: "false"
  # True when WiFi was released while Ethernet carried the device, which makes
  # the next boot start WiFi-silent
  - id: ethernet_expected
    type: bool
    restore_value: yes
    initial_value: '${ethernet_expected_default}'
  # True once WiFi has ever connected, which gates the WiFi recovery probe
  - id: wifi_provisioned
    type: bool
    restore_value: yes
    initial_value: 'false'
  # One update check per boot, on whichever interface connects first
  - id: update_checked
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: firmware_url_backup
    type: std::string
    restore_value: no
  # True once the hotspot has run and been released this boot (it can't relaunch
  # until the next reboot)
  - id: ap_latched
    type: bool
    restore_value: no
    initial_value: 'false'
  # The wifi_fallback substitution as a bool; false is accepted quoted or unquoted
  - id: wifi_fallback_on
    type: bool
    restore_value: no
    initial_value: 'std::string_view("${wifi_fallback}") != "false" && std::string_view("${wifi_fallback}") != "False"'
  # True when WiFi networks come from YAML; set in the initializer (after wifi adds YAML
  # networks, before saved ones load) so a user's on_boot override can't drop it
  - id: wifi_yaml_networks
    type: bool
    restore_value: no
    initial_value: 'wifi::global_wifi_component != nullptr && wifi::global_wifi_component->has_sta()'

i2c:
  sda: GPIO16
  scl: GPIO17
  id: bus_a

web_server:
  id: webserver
  port: 80

one_wire:
  - platform: gpio
    id: one_wire_bus
    pin: GPIO6

# Buzzer
output:
  - platform: ledc
    pin: GPIO8
    id: buzzer

rtttl:
  id: rtttl_buzzer
  output: buzzer

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: gpio
    pin: 
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    id: reset_button
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();    
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 10000) {
              // Remove Wifi
              id(prevent_sleep).turn_on();
              id(factory_reset_switch).turn_on();
            }
            else if (millis() - id(button_press_timestamp) >= 3000) {
              //Turn Prevent Sleep On
              id(prevent_sleep).turn_on();
              //Prevent Sleep
              id(deep_sleep_1).prevent_deep_sleep();
            }
            else {
              // StatusCheck, then self-test (non-blocking)
              id(buttonTapScript).execute();
            }

  - platform: template
    name: Temperature Within Range
    id: temp_within_range
    lambda: 'bool sht_valid = !isnan(id(sht_temperature).state); bool dallas_valid = !isnan(id(temp_probe).state); bool sht_in_range = !sht_valid || ((id(sht_temperature).state <= id(max_temp).state) && (id(sht_temperature).state >= id(min_temp).state)); bool dallas_in_range = !dallas_valid || ((id(temp_probe).state <= id(max_temp).state) && (id(temp_probe).state >= id(min_temp).state)); return (sht_valid || dallas_valid) && sht_in_range && dallas_in_range;'

  - platform: template
    name: Humidity Within Range
    id: humidity_within_range
    # Note: If additional humidity sensors are added, expand this logic following the temperature sensor pattern
    lambda: 'bool sht_valid = !isnan(id(sht_humidity).state); bool sht_in_range = !sht_valid || ((id(sht_humidity).state <= id(max_humidity).state) && (id(sht_humidity).state >= id(min_humidity).state)); return (sht_valid) && sht_in_range;'

  - platform: template
    name: Alarm Active
    id: alarm_active
    lambda: 'return (id(alarm_outside_temp_range).state && !id(temp_within_range).state) || (id(alarm_outside_humidity_range).state && !id(humidity_within_range).state);'
    on_release:
      then:
        - light.turn_off: rgb_light

  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |- 
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:
      then:
        - script.execute: allow_sleep_if_idle

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature
    disabled_by_default: true

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

  - platform: sht3xd
    id: sht30
    temperature:
      name: "SHT Temperature"
      id: sht_temperature
      on_value:
        # Fires only on a successful read (the driver never publishes on a
        # failed one), so the self-test cannot pass on a stale value.
        - lambda: |-
            if (!isnan(x) && x > -40 && x < 125) {
              id(sht30Passed) = true;
            }
    humidity:
      name: "SHT Relative Humidity"
      id: sht_humidity

  - platform: dallas_temp
    name: "Dallas Temperature Probe"
    update_interval: 60s
    id: temp_probe
    filters:
      - lambda: |-
          if (isnan(x)) {
            return NAN;
          }

          if (x == 85.0) {
              return NAN;
          }

          return x;

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO4
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 4
    channel_colors: GRB
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1000ms
          update_interval: 1000ms
          min_brightness: 0%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

button:
  - platform: template
    name: "Update Firmware"
    id: update_firmware
    icon: mdi:cloud-download
    entity_category: config
    on_press:
      - logger.log: "Applying firmware update for the selected channel"
      # OTA download needs the device awake for its whole duration.
      - lambda: |-
          id(deep_sleep_1).prevent_deep_sleep();
      # Set the cached URL aside and refresh from the selected channel, so a forced install
      # never uses an empty or stale manifest; the URL is put back if the refresh fails
      - lambda: |-
          auto &info = const_cast<update::UpdateInfo &>(id(update_http_request).update_info);
          id(firmware_url_backup) = info.firmware_url;
          info.firmware_url.clear();
      - script.execute: apply_ota_source
      - script.wait: apply_ota_source
      - wait_until:
          condition:
            lambda: "return !id(update_http_request).update_info.firmware_url.empty();"
          timeout: 15s
      - if:
          condition:
            lambda: "return !id(update_http_request).update_info.firmware_url.empty();"
          then:
            - lambda: "id(update_http_request).perform(true);"
          else:
            - lambda: "const_cast<update::UpdateInfo &>(id(update_http_request).update_info).firmware_url = id(firmware_url_backup);"
            - logger.log:
                level: WARN
                format: "Firmware Update: manifest refresh failed, not starting an install"
      # Only reached if the update did not start (e.g. manifest unreachable).
      # Re-arm deep sleep unless something else is holding the device awake.
      - script.execute: allow_sleep_if_idle

  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    id: restart_button

  - platform: factory_reset
    disabled_by_default: True
    name: "Factory Reset ESP"
    id: factory_reset_all

number:
  - platform: template
    id: min_temp
    name: Min Temperature
    min_value: -60
    max_value: 100
    step: 0.1
    unit_of_measurement: '°C'
    initial_value: -20
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config

  - platform: template
    id: max_temp
    name: Max Temperature
    min_value: -60
    max_value: 100
    step: 0.1
    unit_of_measurement: '°C'
    initial_value: 100
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config

  - platform: template
    id: min_humidity
    name: Min Humidity
    min_value: 0
    max_value: 100
    step: 0.1
    unit_of_measurement: '%'
    initial_value: 0
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config

  - platform: template
    id: max_humidity
    name: Max Humidity
    min_value: 0
    max_value: 100
    step: 0.1
    unit_of_measurement: '%'
    initial_value: 100
    optimistic: true
    update_interval: never
    mode: box
    entity_category: config


switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: gpio
    pin: GPIO7
    name: "Accessory Power"
    id: accessory_power
    restore_mode: ALWAYS_ON
    setup_priority: 1100
    internal: true

  - platform: template
    name: "Alarm Outside Temp Range"
    id: alarm_outside_temp_range    
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

    
  - platform: template
    name: "Alarm Outside Humidity Range"
    id: alarm_outside_humidity_range    
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    
  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |- 
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - script.execute: allow_sleep_if_idle

  - platform: template
    name: "Bluetooth Proxy"
    id: bluetooth_proxy_switch
    icon: mdi:bluetooth
    entity_category: "config"
    restore_mode: ${bluetooth_proxy_restore_mode}
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:

select:
  - platform: template
    name: "Firmware Channel"
    id: firmware_channel
    icon: mdi:source-branch
    entity_category: "config"
    optimistic: true
    restore_value: true
    options:
      - "Stable"
      - "Beta"
    initial_option: "Stable"
    on_value:
      then:
        - script.execute: apply_ota_source

interval:
  - interval: 10s
    id: alarm_check_interval
    startup_delay: 60s
    then:
      - script.execute: alarm_script
  # No W5500 detected: park the driver's helper task so it can't crash the device polling
  # a floating SPI bus. Runs once after setup, from an interval so on_boot overrides can't drop it
  - id: w5500_park_interval
    interval: 1s
    then:
      - lambda: |-
          static bool checked = false;
          if (checked) return;
          checked = true;
          if (!id(ethernet_1).is_failed()) return;
          TaskHandle_t orphan = xTaskGetHandle("w5500_tsk");
          if (orphan != nullptr) {
            vTaskSuspend(orphan);
            ESP_LOGW("ethernet", "No W5500 detected; parked the W5500 helper task");
          }
  # Any DHCP restart wipes lwIP's shared DNS servers
  # Restore the default interface's copy, as CAST_PRO-1 does
  - id: dns_restore_interval
    interval: 16ms
    then:
      - lambda: |-
          esp_netif_t *netif = esp_netif_get_default_netif();
          if (netif == nullptr || !ip_addr_isany(dns_getserver(0))) return;
          bool restored = false;
          for (auto type : {ESP_NETIF_DNS_MAIN, ESP_NETIF_DNS_BACKUP}) {
            esp_netif_dns_info_t dns{};
            if (esp_netif_get_dns_info(netif, type, &dns) == ESP_OK && dns.ip.u_addr.ip4.addr != 0) {
              esp_netif_set_dns_info(netif, type, &dns);
              restored = true;
            }
          }
          static bool logged = false;
          if (restored && !logged) {
            logged = true;
            ESP_LOGI("network", "DHCP restart cleared DNS; restored the %s servers", esp_netif_get_desc(netif));
          }
  # Retry a released WiFi while Ethernet is up, so an outage doesn't leave the
  # radio silent until the next cable pull
  - id: wifi_recovery_interval
    interval: 10min
    then:
      - if:
          condition:
            and:
              - ethernet.connected:
              - not:
                  wifi.enabled:
              - lambda: "return id(wifi_provisioned) && id(wifi_fallback_on);"
          then:
            - script.execute: wifi_recovery_probe

script:
  - id: apply_ota_source
    # Sets the OTA manifest URL from the Firmware Channel select (Stable/Beta).
    # The manifests are per-variant (ota_*_manifest substitutions) so the legacy
    # _W/_ETH builds keep their own manifests.
    then:
      - lambda: |-
          const bool beta = id(firmware_channel).current_option() == "Beta";
          const char *url = beta ? "${ota_beta_manifest}" : "${ota_stable_manifest}";
          ESP_LOGI("firmware", "OTA manifest set to: %s", url);
          id(update_http_request).set_source_url(url);
      - component.update: update_http_request

  - id: check_for_updates
    # One manifest check per boot, on whichever interface connects first
    then:
      - if:
          condition:
            lambda: "return !id(update_checked);"
          then:
            - lambda: "id(update_checked) = true;"
            - component.update: update_http_request

  - id: wifi_recovery_probe
    # Re-attempt WiFi while Ethernet carries the device; a rejoin restores dual-home
    then:
      - script.execute: wifi_reenable_radio
      - wait_until:
          condition:
            wifi.connected:
          timeout: 60s
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: "id(ethernet_expected) = false;"
          else:
            - if:
                condition:
                  ethernet.connected:
                then:
                  - script.execute: wifi_release_radio

  - id: wifi_reenable_radio
    # With provisioned (not YAML) networks, clear the STA list so start() reloads from and
    # saves to the boot-time NVS key; a second start() in one boot would otherwise switch keys
    then:
      - lambda: |-
          if (id(wifi_1).is_disabled() && !id(wifi_yaml_networks)) {
            id(wifi_1).clear_sta();
          }
      - wifi.enable:

  - id: wifi_release_radio
    # Turn WiFi off while Ethernet carries the device, ending AP+STA and the captive
    # portal. A live hotspot is only remembered (ap_latched); the reboot that clears
    # it happens on cable removal, never at cable connect, so a slow link can't loop.
    then:
      - lambda: "id(ethernet_expected) = true;"
      - if:
          condition:
            wifi.ap_active:
          then:
            - lambda: |-
                id(ap_latched) = true;
                ESP_LOGW("network", "Releasing the active hotspot; Ethernet carries the device");
      - wifi.disable:
      # Also stop Improv BLE so the device isn't offered for WiFi setup it can't complete
      - lambda: |-
          if (id(captive_portal_1).is_active()) {
            id(captive_portal_1).end();
          }
          id(esp32_improv_1).stop();

  - id: allow_sleep_if_idle
    # Re-arm deep sleep (Battery.yaml) unless something still holds the device awake:
    # the Prevent Sleep switch, HA's OTA Mode, or an Ethernet link (wired never sleeps)
    then:
      - if:
          condition:
            and:
              - switch.is_off: prevent_sleep
              - binary_sensor.is_off: ota_mode
              - not:
                  ethernet.connected:
          then:
            - lambda: |-
                id(deep_sleep_1).allow_deep_sleep();

  - id: ethernet_sleep_release
    # Cable gone: re-arm deep sleep only once the link has stayed down for 60s,
    # so a link blip on a USB-powered unit can't send it to sleep. Ethernet
    # on_connect stops this script.
    mode: restart
    then:
      - wait_until:
          condition:
            ethernet.connected:
          timeout: 60s
      - script.execute: allow_sleep_if_idle

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on:
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  or:
                    - ethernet.connected:
                    - wifi.connected:
                then:
                  - logger.log: "Apollo Automation: Connected To Network"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Network"
                  - light.turn_on:
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light

  - id: buttonTapScript
    # Boot button tap: show network/HA status, then run the self-test.
    # statusCheck is stopped before the test so its 5 s timer cannot turn
    # off the test result LED.
    mode: restart
    then:
      - script.execute: statusCheck
      - delay: 3s
      - script.stop: statusCheck
      - light.turn_off: rgb_light
      - lambda: |-
          id(testCycleCount) = 0;
          id(runTest) = true;
      - script.execute: testScript

  - id: testScript
    then:
      if:
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          # Cleared every run; only a fresh in-range SHT reading
          # (sht_temperature on_value) sets it again.
          - lambda: "id(sht30Passed) = false;"
          - switch.turn_on: accessory_power
          - while:
              condition:
                - lambda: "return id(testCycleCount) < 5;"
              then:
                - if:
                    condition:
                      - lambda: "return id(sht30Passed) == false;"
                    then:
                      - component.update: sht30
                      - delay: 1s
                - if:
                    condition:
                      - lambda: "return id(sht30Passed);"
                    then:
                      - lambda: "id(testCycleCount) = 10;"
                - lambda: "id(testCycleCount) += 1;"

          #Check If Test Passed To Trigger Lights
          - if:
              condition:
                - lambda: "return id(sht30Passed);"
              then:
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 100%
                    blue: 0%
              else:
                - light.turn_on:
                    id: rgb_light
                    red: 100%
                    green: 0%
                    blue: 0%
          - delay: 5s
          - light.turn_off: rgb_light

  - id: alarm_script
    then:
      - if:
          condition:
            lambda: !lambda |-
              return id(alarm_active).state;
          then:
            - lambda: !lambda |-
                id(rgb_light).turn_on().set_effect("Fast Pulse").perform();
                id(rgb_light).turn_on().set_rgb(1, 0, 0).set_transition_length(0).perform();
                id(rtttl_buzzer).play("siren:d=8,o=5,b=100:d,e,d,e,d,e,d,e;");

text_sensor:
  - platform: template
    name: "OTA URL"
    id: ota_url
    entity_category: "diagnostic"
    internal: true

  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

  # Which path is carrying the device, for troubleshooting and HA notifications
  - platform: template
    name: "Network Connection"
    id: network_connection
    icon: "mdi:network"
    entity_category: "diagnostic"
    update_interval: 10s
    lambda: |-
      const bool eth = id(ethernet_1).is_connected();
      const bool sta = !id(wifi_1).is_disabled() && id(wifi_1).is_connected();
      const bool ap  = !id(wifi_1).is_disabled() && id(wifi_1).is_ap_active();
      if (eth && sta) return std::string("Ethernet + WiFi");
      if (eth) return std::string("Ethernet");
      if (sta) return std::string("WiFi");
      if (ap) return std::string("Hotspot");
      return std::string("Connecting");

  - platform: ethernet_info
    ip_address:
      name: "Ethernet IP Address"
      id: eth_ip
      entity_category: "diagnostic"

  - platform: wifi_info
    ip_address:
      name: "WiFi IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
